{% extends 'base.html' %}

{% block title %}Register — Hearth &amp; Bean{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Create an account</h1>
        <form action="{% url 'register' %}" method="post">
            {% csrf_token %}
            {{ form }}
            <div class="auth-actions">
                <button type="submit" class="btn-primary-full">Register</button>
            </div>
        </form>
        <span class="auth-alt-link">Already have an account? <a href="{% url 'login' %}">Log in</a></span>
    </div>
</div>
{% endblock %}
