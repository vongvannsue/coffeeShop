{% block content %}
    <style>
        /* Container styling */
        .login-container {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background-color: #f4f4f4;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .form-with-validation label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }

        .form-with-validation input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .form-submit {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }

        .form-submit:hover {
            background-color: #0056b3;
        }
    </style>

    <div class="login-container">
        <h1>User Login</h1>
        <form class="form-with-validation" action="login/" method="post">
            {% csrf_token %}
            {{ form }}
            <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                <a href="register/" class="form-submit"
                   style="background-color: #6c757d; text-align: center; text-decoration: none; padding: 12px;">Register</a>
                <button type="submit" class="form-submit">Submit</button>
            </div>
        </form>
    </div>
{% endblock %}
