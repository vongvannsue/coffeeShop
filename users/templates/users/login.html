{% extends 'base.html' %}

{% block title %}Login — Hearth &amp; Bean{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Welcome back</h1>
        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {{ form }}
            <div class="auth-actions">
                <button type="submit" class="btn-primary-full">Log in</button>
            </div>
        </form>
        <span class="auth-alt-link">New here? <a href="{% url 'register' %}">Create an account</a></span>
    </div>
</div>
{% endblock %}
